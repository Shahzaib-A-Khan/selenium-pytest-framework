name: Selenium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Selenium tests
        run: pytest
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pytest-report
          path: reports/
          retention-days: 14